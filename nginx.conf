# ============================================================
# 《织纹集》Nginx 配置（挂载至 /etc/nginx/conf.d/default.conf）
# 静态托管 Vite 构建产物 + SPA 路由回退 + 商汤 API 反向代理
# ============================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩，提升加载速度
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带指纹的静态资源可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 1. 商汤日日新（SenseNova）API 反向代理 ----------
    # 前端请求：/api/sensenova/v1/images/generations（与页面同源，无跨域问题）
    # rewrite 剥掉 /api/sensenova 前缀后，转发为 /v1/images/generations
    # 注意：proxy_pass 只写域名、不带 URI 路径，改写后的路径才会被透传
    # （本项目验证可用的域名是 token.sensenova.cn；
    #   若需换回 api.sensenova.cn，同步修改下面 proxy_pass 与 Host 两行即可）
    location /api/sensenova/ {
        rewrite ^/api/sensenova/(.*)$ /$1 break;
        proxy_pass https://token.sensenova.cn;

        # 传输必要的请求头（Authorization 等客户端请求头默认自动透传）
        proxy_set_header Host token.sensenova.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTPS 上游：开启 SNI，确保与商汤服务的 TLS 握手正常
        proxy_ssl_server_name on;

        # 生图接口耗时较长，放宽超时（默认 60s 可能不够）
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;

        # 跨域头：同源部署下非必需；保留以便直接以 API 方式调用
        # always 确保上游报错（4xx/5xx）时也带上这些头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        # OPTIONS 预检请求直接返回 204
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ---------- 2. React Router SPA 路由回退 ----------
    # /gallery、/workbench、/inspiration、/diagnostics 等前端路由
    # 刷新或直接访问时，都返回 index.html 交给 React Router 处理，
    # 否则 Nginx 会返回 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 自定义错误页也走前端入口，避免刷新时出现 Nginx 默认 404 页
    error_page 404 /index.html;
}
