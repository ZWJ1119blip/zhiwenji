# ============================================================
# 《织纹集》Nginx 配置（挂载至 /etc/nginx/conf.d/default.conf）
# 静态托管 Vite 构建产物 + SPA 前端路由回退
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩，提升加载速度
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带指纹的静态资源可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 核心：SPA 路由回退
    # /gallery、/workbench、/inspiration、/diagnostics 等前端路由
    # 刷新或直接访问时，都返回 index.html 交给 React Router 处理，
    # 否则 Nginx 会返回 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 自定义错误页也走前端入口，避免刷新时出现 Nginx 默认 404 页
    error_page 404 /index.html;
}
